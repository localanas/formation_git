name: Deploy Laravel (SSH)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ssh_key   # ton environment GitHub

    steps:
      # Étape 1 : Démarrer l'agent SSH
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # Étape 2 : Déploiement sur la VM
      - name: Deploy on Azure VM
        run: |
          VM_USER="anasnadi"
          VM_IP="4.233.147.103"
          PROJECT_DIR="/home/anasnadi/git/project/formation_git/laravel"

          ssh -t -o StrictHostKeyChecking=no $VM_USER@$VM_IP "
            set -e

            echo '✅ Connecté au serveur'

            # Vérifier que le dossier existe
            if [ ! -d '$PROJECT_DIR' ]; then
              echo '❌ Erreur : le dossier $PROJECT_DIR n'existe pas !'
              exit 1
            fi

            cd '$PROJECT_DIR'
            echo '📥 Git pull'
            git fetch --all
            git reset --hard origin/main

            echo '📦 Composer install'
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo '🧹 Laravel cache clear'
            php artisan optimize:clear

            echo '⚡ Laravel optimize'
            php artisan optimize

            echo '🔁 Restart PHP (si service existe)'
            sudo systemctl restart php8.2-fpm || echo '⚠️ PHP service not found, skipped'

            echo '✅ Déploiement terminé avec succès'
          "
