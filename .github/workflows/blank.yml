name: Deploy Laravel Simple

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ssh_key

    steps:
      # 🔹 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔹 2️⃣ SSH Agent
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 🔹 3️⃣ Deploy
      - name: Deploy on VM
        run: |
          VM_USER="anasnadi"
          VM_IP="4.233.147.103"
          PROJECT_DIR="/home/anasnadi/formation/anass_nadi/formation_git/demo_laravel"

          echo "🔑 Connecting to $VM_USER@$VM_IP"

          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP << EOF
            set -e

            echo "✅ Connecté au serveur"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Dossier introuvable: $PROJECT_DIR"
              exit 1
            fi

            cd $PROJECT_DIR
            echo "📂 Current directory: \$(pwd)"

            echo "🔎 PHP version"
            php -v

            echo "🔎 Composer version"
            composer -V

            echo "📥 Git pull"
            git fetch --all
            git reset --hard origin/main

            echo "📦 Composer install"
            COMPOSER_MEMORY_LIMIT=-1 composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            echo "🗄️ Laravel migrate"
            php artisan migrate --force

            echo "🧹 Clear & optimize"
            php artisan optimize:clear
            php artisan optimize

            echo "🔁 Restart PHP-FPM"
            sudo systemctl restart php8.3-fpm || echo "⚠️ PHP-FPM not restarted"

            echo "✅ Déploiement terminé"
          EOF
