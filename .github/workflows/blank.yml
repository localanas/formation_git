name: Deploy Laravel Simple

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ssh_key

    steps:
      # 🔹 Étape 1 : Récupérer le code du repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔹 Étape 2 : Démarrer l'agent SSH avec la clé privée
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 🔹 Étape 3 : Déploiement sur la VM
      - name: Deploy on VM
        run: |
          VM_USER="anasnadi"
          VM_IP="4.233.147.103"
          PROJECT_DIR="/home/anasnadi/git/project/formation_git/laravel"

          echo "🔑 Connecting to $VM_USER@$VM_IP"

          ssh -t -o StrictHostKeyChecking=no $VM_USER@$VM_IP "
            set -e  # Arrêter en cas d'erreur

            echo '✅ Connecté au serveur'

            # 🔹 Vérifier que le dossier existe
            if [ ! -d $PROJECT_DIR ]; then
              echo '❌ Erreur : dossier $PROJECT_DIR introuvable'
              exit 1
            fi

            cd $PROJECT_DIR
            echo '📂 Current directory:' \$(pwd)

            # 🔹 Vérifier PHP et Composer
            php -v || { echo '❌ PHP non trouvé'; exit 1; }
            composer -V || { echo '❌ Composer non trouvé'; exit 1; }

            # 🔹 Pull du code Git
            echo '📥 Git pull'
            git fetch --all
            git reset --hard origin/main

            # 🔹 Installer les dépendances
            echo '📦 Composer install'
            composer install --no-interaction --prefer-dist --optimize-autoloader --quiet

            # 🔹 Nettoyer et optimiser Laravel
            echo '🧹 Laravel cache clear & optimize'
            php artisan optimize:clear
            php artisan optimize

            # 🔹 Redémarrer PHP-FPM
            echo '🔁 Restart PHP-FPM'
            sudo systemctl restart php8.2-fpm || echo '⚠️ PHP-FPM service not found, skipped'

            echo '✅ Déploiement terminé'
          "
