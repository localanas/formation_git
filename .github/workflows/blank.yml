name: Deploy Laravel Full CI/CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ssh_key

    steps:
      # 🔹 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔹 2️⃣ SSH Agent
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 🔹 3️⃣ Deploy + tests + pre-commit
      - name: Deploy on VM
        run: |
          VM_USER="anasnadi"
          VM_IP="4.233.147.103"
          PROJECT_DIR="/home/anasnadi/formation/anass_nadi/formation_git/demo_laravel"

          echo "🔑 Connecting to $VM_USER@$VM_IP"

          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP bash << 'ENDSSH'
            set -e  # Stop workflow si une commande échoue

            echo "✅ Connecté au serveur"

            # 🔹 Aller dans le projet
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Dossier introuvable: $PROJECT_DIR"
              exit 1
            fi
            cd "$PROJECT_DIR"
            echo "📂 Current directory: $(pwd)"

            # 🔹 Activer le pre-commit hook
            if [ -f ".git/hooks/pre-commit" ]; then
              chmod +x .git/hooks/pre-commit
              echo "🔧 Pre-commit hook activé"
            fi

            # 🔹 Vérifier PHP et Composer
            echo "🔎 PHP version"
            php -v
            echo "🔎 Composer version"
            composer -V

            # 🔹 Pull du code
            echo "📥 Git pull"
            git fetch --all
            git reset --hard origin/main

            # 🔹 Installer les dépendances
            echo "📦 Composer install"
            COMPOSER_MEMORY_LIMIT=-1 composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            # 🔹 Exécuter le pre-commit hook
            if [ -f ".git/hooks/pre-commit" ]; then
              echo "⚡ Running pre-commit hook"
              .git/hooks/pre-commit || { echo "❌ Pre-commit failed"; exit 1; }
            fi

            # 🔹 Lancer les tests Laravel
            echo "🧪 Running Laravel tests"
            php artisan test || { echo "❌ Tests échoués"; exit 1; }

            # 🔹 Migrer la base
            echo "🗄️ Laravel migrate"
            php artisan migrate --force

            # 🔹 Clear & optimize
            echo "🧹 Clear & optimize"
            php artisan optimize:clear
            php artisan optimize

            # 🔹 Redémarrer PHP-FPM
            echo "🔁 Restart PHP-FPM"
            sudo systemctl restart php8.3-fpm || echo "⚠️ PHP-FPM not restarted"

            echo "✅ Déploiement terminé"
ENDSSH
